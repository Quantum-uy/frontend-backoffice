<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGeRU - Rutas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">S</div>
                <span>SiGeRU</span>
            </div>
            <nav>
                <a href="index.html" data-page="dashboard"><span>Dashboard</span></a>
                <a href="usuarios.html" data-page="usuarios"><span>Usuarios</span></a>
                <a href="camiones.html" data-page="camiones"><span>Camiones</span></a>
                <a href="contenedores.html" data-page="contenedores"><span>Contenedores</span></a>
                <a href="rutas.html" data-page="rutas" class="active"><span>Rutas</span></a>
                <a href="incidencias.html" data-page="incidencias"><span>Incidencias</span></a>
                <a href="centros-acopio.html" data-page="centros-acopio"><span>Centros de Acopio</span></a>
                <a href="maquinaria.html" data-page="maquinaria"><span>Maquinaria</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </aside>

        <main class="main-content">
            <!-- Vista admin/operario -->
            <div id="vista-admin">
                <div class="page-header">
                    <div>
                        <div class="subtitle">Planificación</div>
                        <h1>Rutas de recolección</h1>
                    </div>
                    <button class="btn btn-primary" onclick="abrirModal()">+ Agregar ruta</button>
                </div>
                <div class="card">
                    <div class="search-bar">
                        <input type="text" id="buscar" placeholder="Buscar por nombre, zona o estado" oninput="filtrar()">
                    </div>
                    <div style="overflow-x:auto">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Zona</th>
                                    <th>Conductor</th>
                                    <th>Camión</th>
                                    <th>Contenedores</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-rutas"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Vista conductor/peon -->
            <div id="vista-conductor" style="display:none">
                <div class="page-header">
                    <div>
                        <div class="subtitle">Mi recorrido</div>
                        <h1>Mis rutas asignadas</h1>
                    </div>
                    <div class="user-role" id="user-role-rutas"></div>
                </div>
                <div id="lista-rutas-conductor"></div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-titulo">Agregar ruta</h2>
            <form id="form-ruta">
                <input type="hidden" id="ruta-id">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej. Ruta Centro" required>
                </div>
                <div class="form-group">
                    <label for="zona">Zona</label>
                    <input type="text" id="zona" placeholder="Ej. Centro / Cordón" required>
                </div>
                <div class="form-group">
                    <label for="numero">Número de sub-zona</label>
                    <input type="number" id="numero" min="1" value="1">
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" placeholder="Descripción del recorrido" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="id_conductor">Conductor asignado</label>
                    <select id="id_conductor">
                        <option value="">Sin asignar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="id_camion_ruta">Camión asignado</label>
                    <select id="id_camion_ruta">
                        <option value="">Sin asignar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="color">Color en el mapa</label>
                    <input type="color" id="color" value="#1a5c52">
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado">
                        <option value="activa">Activa</option>
                        <option value="inactiva">Inactiva</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="width:auto">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js?v=4"></script>
    <script src="js/rutas.js?v=4"></script>
</body>
</html>
