<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGeRU - Camiones</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">S</div>
                <span>SiGeRU</span>
            </div>
            <nav>
                <a href="index.html" data-page="dashboard"><span>Dashboard</span></a>
                <a href="usuarios.html" data-page="usuarios"><span>Usuarios</span></a>
                <a href="camiones.html" data-page="camiones" class="active"><span>Camiones</span></a>
                <a href="contenedores.html" data-page="contenedores"><span>Contenedores</span></a>
                <a href="rutas.html" data-page="rutas"><span>Rutas</span></a>
                <a href="incidencias.html" data-page="incidencias"><span>Incidencias</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <div class="subtitle">Gestión de flota</div>
                    <h1>Camiones</h1>
                </div>
                <button class="btn btn-primary" onclick="abrirModal()">+ Agregar camión</button>
            </div>

            <div class="card">
                <div class="search-bar">
                    <input type="text" id="buscar" placeholder="Buscar por matrícula, modelo o estado" oninput="filtrar()">
                </div>
                <div style="overflow-x:auto">
                    <table>
                        <thead>
                            <tr>
                                <th>Matrícula</th>
                                <th>Modelo</th>
                                <th>Estado</th>
                                <th>Tipo residuo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-camiones"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-titulo">Agregar camión</h2>
            <form id="form-camion">
                <input type="hidden" id="camion-id">
                <div class="form-group">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" required>
                </div>
                <div class="form-group">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" required>
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado">
                        <option value="disponible">Disponible</option>
                        <option value="en_ruta">En ruta</option>
                        <option value="mantenimiento">Mantenimiento</option>
                        <option value="fuera_servicio">Fuera de servicio</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="id_tipo_residuo">Tipo de residuo (ID)</label>
                    <input type="number" id="id_tipo_residuo" min="1" value="1">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="width:auto">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/camiones.js"></script>
</body>
</html>
