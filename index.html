<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGeRU - Panel Interno</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">S</div>
                <span>SiGeRU</span>
            </div>
            <nav>
                <a href="index.html" data-page="dashboard" class="active"><span>Dashboard</span></a>
                <a href="usuarios.html" data-page="usuarios"><span>Usuarios</span></a>
                <a href="camiones.html" data-page="camiones"><span>Camiones</span></a>
                <a href="contenedores.html" data-page="contenedores"><span>Contenedores</span></a>
                <a href="rutas.html" data-page="rutas"><span>Rutas</span></a>
                <a href="incidencias.html" data-page="incidencias"><span>Incidencias</span></a>
                <a href="centros-acopio.html" data-page="centros-acopio"><span>Centros de Acopio</span></a>
                <a href="maquinaria.html" data-page="maquinaria"><span>Maquinaria</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <div class="subtitle">Panel interno</div>
                    <h1 id="dashboard-titulo">Resumen operativo</h1>
                </div>
                <div class="user-role" id="user-role"></div>
            </div>

            <div id="dashboard-content"></div>
        </main>
    </div>

    <script src="js/app.js?v=4"></script>
    <script>
        const usuario = getUsuario();
        if (usuario) {
            document.getElementById('user-role').textContent = usuario.rol || 'Funcionario';
            aplicarPermisos();
            renderDashboard(usuario);
        }

        function renderDashboard(u) {
            const container = document.getElementById('dashboard-content');
            const titulo = document.getElementById('dashboard-titulo');

            switch (u.rol) {
                case 'administrador':
                    titulo.textContent = 'Resumen operativo';
                    container.innerHTML = `
                        <div class="stats-grid">
                            <div class="stat-card"><div class="number" id="stat-camiones">-</div><div class="label">Camiones disponibles</div></div>
                            <div class="stat-card"><div class="number" id="stat-usuarios">-</div><div class="label">Usuarios registrados</div></div>
                            <div class="stat-card"><div class="number" id="stat-contenedores">-</div><div class="label">Contenedores registrados</div></div>
                        </div>
                        <div class="stats-grid" style="margin-top:1.5rem">
                            <div class="stat-card"><div class="number" id="stat-rutas">-</div><div class="label">Rutas activas</div></div>
                            <div class="stat-card"><div class="number" id="stat-incidencias">-</div><div class="label">Incidencias abiertas</div></div>
                            <div class="stat-card"><div class="number" id="stat-centros">-</div><div class="label">Centros de acopio</div></div>
                        </div>`;
                    loadAdminStats();
                    break;

                case 'operario':
                    titulo.textContent = 'Panel del operario';
                    container.innerHTML = `
                        <div class="card" style="padding:1.5rem;margin-bottom:1.5rem">
                            <h3>Bienvenido, ${u.nombre}</h3>
                            <p style="color:var(--text-secondary,#666);margin-top:.5rem">Tu rol es gestionar contenedores, centros de acopio y reportar incidencias.</p>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card"><div class="number" id="stat-contenedores">-</div><div class="label">Contenedores asignados</div></div>
                            <div class="stat-card"><div class="number" id="stat-incidencias">-</div><div class="label">Incidencias abiertas</div></div>
                            <div class="stat-card"><div class="number" id="stat-centros">-</div><div class="label">Centros de acopio</div></div>
                        </div>
                        <div class="card" style="padding:1.5rem;margin-top:1.5rem">
                            <h3>Accesos rápidos</h3>
                            <div style="display:flex;gap:1rem;margin-top:1rem">
                                <a href="contenedores.html" class="btn btn-primary">Ver contenedores</a>
                                <a href="incidencias.html" class="btn btn-primary">Reportar incidencia</a>
                                <a href="centros-acopio.html" class="btn btn-primary">Centros de acopio</a>
                            </div>
                        </div>`;
                    loadOperarioStats();
                    break;

                case 'conductor':
                    titulo.textContent = 'Panel del conductor';
                    container.innerHTML = `
                        <div class="card" style="padding:1.5rem;margin-bottom:1.5rem">
                            <h3>Bienvenido, ${u.nombre}</h3>
                            <p style="color:var(--text-secondary,#666);margin-top:.5rem">Consultá tu ruta asignada del día y reportá incidencias en el recorrido.</p>
                        </div>
                        <div class="card" style="padding:1.5rem;margin-bottom:1.5rem">
                            <h3>Mi asignación</h3>
                            <div id="mi-asignacion" style="margin-top:1rem">
                                <p style="color:#888">Cargando...</p>
                            </div>
                        </div>
                        <div class="card" style="padding:1.5rem;margin-bottom:1.5rem">
                            <h3>Ruta del día</h3>
                            <div id="ruta-dia" style="margin-top:1rem">
                                <p style="color:#888">Cargando ruta asignada...</p>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card"><div class="number" id="stat-incidencias">-</div><div class="label">Incidencias reportadas</div></div>
                        </div>
                        <div class="card" style="padding:1.5rem;margin-top:1.5rem">
                            <h3>Accesos rápidos</h3>
                            <div style="display:flex;gap:1rem;margin-top:1rem">
                                <a href="rutas.html" class="btn btn-primary">Ver rutas</a>
                                <a href="incidencias.html" class="btn btn-primary">Reportar incidencia</a>
                            </div>
                        </div>`;
                    loadConductorStats();
                    break;

                case 'peon':
                    titulo.textContent = 'Panel del peón';
                    container.innerHTML = `
                        <div class="card" style="padding:1.5rem;margin-bottom:1.5rem">
                            <h3>Bienvenido, ${u.nombre}</h3>
                            <p style="color:var(--text-secondary,#666);margin-top:.5rem">Consultá tu ruta asignada y reportá incidencias durante la recolección.</p>
                        </div>
                        <div class="card" style="padding:1.5rem;margin-bottom:1.5rem">
                            <h3>Ruta asignada</h3>
                            <div id="ruta-dia" style="margin-top:1rem">
                                <p style="color:#888">Cargando ruta asignada...</p>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card"><div class="number" id="stat-incidencias">-</div><div class="label">Incidencias reportadas</div></div>
                        </div>
                        <div class="card" style="padding:1.5rem;margin-top:1.5rem">
                            <h3>Accesos rápidos</h3>
                            <div style="display:flex;gap:1rem;margin-top:1rem">
                                <a href="rutas.html" class="btn btn-primary">Ver rutas</a>
                                <a href="incidencias.html" class="btn btn-primary">Reportar incidencia</a>
                            </div>
                        </div>`;
                    loadConductorStats();
                    break;

                default:
                    titulo.textContent = 'Panel';
                    container.innerHTML = '<div class="card" style="padding:1.5rem"><p>No se pudo determinar tu rol. Contactá al administrador.</p></div>';
            }
        }

        async function loadAdminStats() {
            try {
                const [camiones, usuarios, contenedores, rutas, incidencias, centros] = await Promise.all([
                    fetch(API_CAMIONES + '/camiones').then(r => r.json()).catch(() => []),
                    fetch(API_USUARIOS + '/usuarios').then(r => r.json()).catch(() => []),
                    fetch(API_GESTION + '/contenedores').then(r => r.json()).catch(() => []),
                    fetch(API_GESTION + '/rutas').then(r => r.json()).catch(() => []),
                    fetch(API_GESTION + '/incidencias').then(r => r.json()).catch(() => []),
                    fetch(API_GESTION + '/centros-acopio').then(r => r.json()).catch(() => [])
                ]);
                document.getElementById('stat-camiones').textContent = camiones.length;
                document.getElementById('stat-usuarios').textContent = usuarios.length;
                document.getElementById('stat-contenedores').textContent = contenedores.length;
                document.getElementById('stat-rutas').textContent = rutas.length;
                document.getElementById('stat-incidencias').textContent = incidencias.filter(i => i.estado === 'abierta').length;
                document.getElementById('stat-centros').textContent = centros.length;
            } catch (e) { console.error('Error stats admin:', e); }
        }

        async function loadOperarioStats() {
            try {
                const [contenedores, incidencias, centros] = await Promise.all([
                    fetch(API_GESTION + '/contenedores').then(r => r.json()).catch(() => []),
                    fetch(API_GESTION + '/incidencias').then(r => r.json()).catch(() => []),
                    fetch(API_GESTION + '/centros-acopio').then(r => r.json()).catch(() => [])
                ]);
                document.getElementById('stat-contenedores').textContent = contenedores.length;
                document.getElementById('stat-incidencias').textContent = incidencias.filter(i => i.estado === 'abierta').length;
                document.getElementById('stat-centros').textContent = centros.length;
            } catch (e) { console.error('Error stats operario:', e); }
        }

        async function loadConductorStats() {
            try {
                const [rutas, incidencias, camiones] = await Promise.all([
                    fetch(API_GESTION + '/rutas').then(r => r.json()).catch(() => []),
                    fetch(API_GESTION + '/incidencias').then(r => r.json()).catch(() => []),
                    fetch(API_CAMIONES + '/camiones').then(r => r.json()).catch(() => [])
                ]);
                document.getElementById('stat-incidencias').textContent = incidencias.filter(i => i.estado === 'abierta').length;

                const misRutas = rutas.filter(r => r.id_conductor == usuario.id_usuario);
                const miRuta = misRutas[0];

                const asignacion = document.getElementById('mi-asignacion');
                if (asignacion) {
                    if (miRuta) {
                        asignacion.innerHTML = `
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                                <div style="padding:1rem;background:var(--bg-card,#f8f9fa);border-radius:8px">
                                    <div style="font-size:.85rem;color:#888">Camión</div>
                                    <strong>${miRuta.camion || 'Sin asignar'}</strong>
                                    ${miRuta.camion_estado ? '<span class="badge ' + getBadgeClass(miRuta.camion_estado) + '" style="margin-left:.5rem">' + miRuta.camion_estado + '</span>' : ''}
                                </div>
                                <div style="padding:1rem;background:var(--bg-card,#f8f9fa);border-radius:8px">
                                    <div style="font-size:.85rem;color:#888">Peón acompañante</div>
                                    <strong>${miRuta.peon || 'Sin asignar'}</strong>
                                </div>
                            </div>`;
                    } else {
                        asignacion.innerHTML = '<p style="color:#888">No tenés asignación activa.</p>';
                    }
                }

                const rutaDia = document.getElementById('ruta-dia');
                if (misRutas.length > 0) {
                    rutaDia.innerHTML = misRutas.map(r => `
                        <div style="display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--bg-card,#f8f9fa);border-radius:8px;margin-bottom:.5rem">
                            <div style="width:12px;height:12px;border-radius:50%;background:${r.color || '#1a5c52'}"></div>
                            <div>
                                <strong>${r.nombre}</strong>
                                <p style="color:#666;margin-top:.25rem">${r.zona} â€” ${r.contenedores ? r.contenedores.length : 0} contenedores</p>
                            </div>
                        </div>`).join('');
                } else {
                    rutaDia.innerHTML = '<p style="color:#888">No hay rutas asignadas por el momento.</p>';
                }
            } catch (e) { console.error('Error stats conductor:', e); }
        }
    </script>
</body>
</html>
