server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /sigeru/frontend-backoffice/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location /sigeru/api-usuarios/ {
        proxy_pass http://sigeru-api-usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sigeru/api-camiones/ {
        proxy_pass http://sigeru-api-camiones/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sigeru/api-gestion/ {
        proxy_pass http://sigeru-api-gestion/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sigeru/api-recoleccion/ {
        proxy_pass http://sigeru-api-recoleccion/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
