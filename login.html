<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGeRU - Ingreso al sistema</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">S</div>
                <span>SiGeRU</span>
            </div>
            <h1>Ingreso al sistema</h1>
            <p>Acceso exclusivo para usuarios internos habilitados por el administrador.</p>

            <div id="error-msg" class="error-msg"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="usuario@sigeru.uy" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>

            <p class="login-footer">¿No tenés acceso? Contactá al administrador.</p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
